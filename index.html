<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#1769ff">

    <meta
        name="description"
        content="BAYA Account Portal - Manage your account and requests."
    >

    <title>BAYA | Account Portal</title>

    <link rel="stylesheet" href="/styles.css">

    <script src="/app.js" defer></script>
</head>

<body>

    <!-- Notification Messages -->
    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>

    <!-- Main Application -->
    <main id="root">

        <!-- Loading Screen -->
        <section
            class="loading-screen"
            aria-label="Loading application"
        >

            <div class="loading-brand">
                BAYA
            </div>

            <div class="loading-spinner"></div>

            <p>Loading your account...</p>

        </section>

    </main>

    <noscript>
        <div class="noscript-message">
            Please enable JavaScript to use the BAYA Account Portal.
        </div>
    </noscript>

</body>
</html>
